name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: as
          POSTGRES_PASSWORD: as_dev
          POSTGRES_DB: as_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U as -d as_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://as:as_dev@localhost:5432/as_app
      AUTH_SECRET: ci-secret-phase1-min-32-characters!!!!
      RAZORPAY_MOCK: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Migrate + seed
        run: |
          alembic upgrade head
          python -c "from app.db import SessionLocal; from app.seed import run_seed; db=SessionLocal(); run_seed(db); db.close()"
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NUXT_API_PROXY: http://localhost:8000
          NUXT_PUBLIC_API_BASE: /api
          NUXT_PUBLIC_VENDOR_SLUG: as-demo
          NUXT_PUBLIC_APP_URL: http://localhost:3000
